services:
  - type: web
    name: resumexpert-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: FRONTEND_URL
        value: "https://resume-xpert-zeta.vercel.app,https://resume-xpert-7fdxq4b1r-jyoti-works.vercel.app"
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/resumexpert-uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
